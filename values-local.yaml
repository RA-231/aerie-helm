# Local development overrides for Docker Desktop / single-node-style runs.
# Usage:
#   helm install aerie . -n aerie --create-namespace \
#     --kube-context docker-desktop -f values-local.yaml
#
# Why these overrides:
# - The shared file store PVC is ReadWriteMany, but the local-path provisioner
#   backs it with a per-node hostPath. On a multi-node local cluster, pods that
#   share that volume must co-locate or they won't actually see the same files.
#   Pinning every Aerie pod to one node makes the RWX hostPath behave.
nodeSelector:
  kubernetes.io/hostname: desktop-worker

# The local-path provisioner only supports ReadWriteOnce. The shared file store
# defaults to ReadWriteMany, which leaves the PVC Pending forever locally.
# Because all pods are pinned to one node above, RWO is safe — co-located pods
# on the same node can all mount the same volume.
fileStore:
  accessMode: ReadWriteOnce
