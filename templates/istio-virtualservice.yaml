{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "aerie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerie.labels" . | nindent 4 }}
spec:
  gateways:
    - {{ .Values.istio.gateway }}
  hosts:
    - {{ .Values.istio.host }}
  http:
    # UI - serves the main application (catch-all, must be last)
    # But we define specific routes first, then UI as fallback

    # Hasura GraphQL endpoint
    - match:
        - uri:
            prefix: /v1/graphql
        - uri:
            prefix: /v1/query
        - uri:
            prefix: /v1/metadata
        - uri:
            prefix: /console
        - uri:
            prefix: /v1/version
      corsPolicy:
        {{- toYaml .Values.istio.corsPolicy | nindent 8 }}
      route:
        - destination:
            host: {{ include "aerie.fullname" . }}-hasura
            port:
              number: {{ .Values.hasura.service.port }}

    # Aerie gateway - only the paths the browser calls on it directly (file
    # store + external-source uploads). /auth/* and /health are SvelteKit routes
    # served by the UI itself (the UI's /auth/login sets the session cookie and
    # proxies to the gateway server-side), so they must NOT be routed here or
    # login succeeds without a cookie and bounces back to /login.
    - match:
        - uri:
            prefix: /file
        - uri:
            prefix: /uploadExternalSource
      corsPolicy:
        {{- toYaml .Values.istio.corsPolicy | nindent 8 }}
      route:
        - destination:
            host: {{ include "aerie.fullname" . }}-gateway
            port:
              number: {{ .Values.gateway.service.port }}

    # Action server
    - match:
        - uri:
            prefix: /action/
      corsPolicy:
        {{- toYaml .Values.istio.corsPolicy | nindent 8 }}
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "aerie.fullname" . }}-action
            port:
              number: {{ .Values.action.port }}

    # Workspace server
    - match:
        - uri:
            prefix: /workspace/
      corsPolicy:
        {{- toYaml .Values.istio.corsPolicy | nindent 8 }}
      rewrite:
        uri: /
      route:
        - destination:
            host: {{ include "aerie.fullname" . }}-workspace
            port:
              number: {{ .Values.workspace.port }}

    # UI - default route (must be last)
    - match:
        - uri:
            prefix: /
      corsPolicy:
        {{- toYaml .Values.istio.corsPolicy | nindent 8 }}
      route:
        - destination:
            host: {{ include "aerie.fullname" . }}-ui
            port:
              number: {{ .Values.ui.service.port }}
{{- end }}
