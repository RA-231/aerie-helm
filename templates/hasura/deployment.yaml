{{- if .Values.hasura.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aerie.fullname" . }}-hasura
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aerie.componentLabels" (dict "root" . "component" "hasura") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aerie.componentSelectorLabels" (dict "root" . "component" "hasura") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aerie.componentSelectorLabels" (dict "root" . "component" "hasura") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ include "aerie.postgresql.host" . }} {{ include "aerie.postgresql.port" . }}; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: hasura
          image: {{ include "aerie.image" (dict "root" . "repository" .Values.hasura.image.repository "tag" .Values.hasura.image.tag) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Uses the built-in cli-migrations entrypoint which auto-applies metadata.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Database credentials and connection URLs. The username/password are
            # provided as env vars and interpolated into the URLs via the K8s
            # $(VAR) syntax (matching Aerie's upstream docker-compose). NOTE: the
            # password is not URL-encoded here, so avoid passwords containing
            # RFC 3986 reserved characters (@ : / ? # etc.).
            - name: AERIE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aerie.postgresql.secretName" . }}
                  key: aerie-user
            - name: AERIE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aerie.postgresql.secretName" . }}
                  key: aerie-password
            - name: AERIE_DATABASE_URL
              value: "postgres://$(AERIE_USERNAME):$(AERIE_PASSWORD)@{{ include "aerie.postgresql.host" . }}:{{ include "aerie.postgresql.port" . }}/{{ include "aerie.postgresql.database" . }}?options=-c%20search_path%3Dutil_functions%2Chasura%2Cpermissions%2Ctags%2Cmerlin%2Cscheduler%2Csequencing%2Cactions%2Cui%2Cpublic"
            - name: HASURA_GRAPHQL_METADATA_DATABASE_URL
              value: "postgres://$(AERIE_USERNAME):$(AERIE_PASSWORD)@{{ include "aerie.postgresql.host" . }}:{{ include "aerie.postgresql.port" . }}/aerie_hasura"
            # Service URLs - using correct K8s service names (hyphens, not underscores!)
            - name: AERIE_MERLIN_URL
              value: {{ include "aerie.merlin.url" . | quote }}
            - name: AERIE_SCHEDULER_URL
              value: {{ include "aerie.scheduler.url" . | quote }}
            - name: AERIE_SEQUENCING_URL
              value: {{ include "aerie.sequencing.url" . | quote }}
            # Hasura configuration
            - name: HASURA_GRAPHQL_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hasura.existingSecret | default (printf "%s-hasura-secrets" (include "aerie.fullname" .)) }}
                  key: admin-secret
            - name: HASURA_GRAPHQL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hasura.existingSecret | default (printf "%s-hasura-secrets" (include "aerie.fullname" .)) }}
                  key: jwt-secret
            - name: HASURA_GRAPHQL_DEV_MODE
              value: {{ .Values.hasura.devMode | quote }}
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: {{ .Values.hasura.enableConsole | quote }}
            - name: HASURA_GRAPHQL_LOG_LEVEL
              value: {{ .Values.hasura.logLevel | quote }}
            - name: HASURA_GRAPHQL_ENABLED_LOG_TYPES
              value: "startup, http-log, webhook-log, websocket-log, query-log"
            - name: HASURA_GRAPHQL_METADATA_DIR
              value: /hasura-metadata
            - name: HASURA_GRAPHQL_INFER_FUNCTION_PERMISSIONS
              value: "false"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.hasura.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
